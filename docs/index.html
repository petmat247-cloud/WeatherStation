<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanice — Meteorologický dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #84a1e6;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 480px;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: #4e6ea1;
            border-radius: 12px;
            border: 1px solid #5b79a4;
        }
        .status span {
            color: #76da9a;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stanice</h1>
        <p>Meteorologický dashboard se připravuje.</p>
        <div class="status">
            <p>Backend: <span>běží</span></p>
            <p>Frontend: <span style="color: #f59e0b;">připravuje se </span></p>
        </div>
    </div>
</body>
</html>
